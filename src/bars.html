<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wright Donor Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  /* Everything is scoped under .bars-embed so the chart can be included in the article without its styles leaking out. */
  .bars-embed {
    color-scheme: light;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #55555c;
    --rule: #deded9;
    --axis: #a9a9a3;
    --wright: #1f8a9e;
    --highlight: #0d4a57;
    /* In the article the fixed navbar covers the top of the screen; on its own the page has no navbar. */
    --bars-top: var(--navbar-height, 0px);
    background: var(--surface);
    color: var(--ink);
    font: 16px/1.45 Roboto, sans-serif;
  }
  body { margin: 0; }
  .bars-embed, .bars-embed * { box-sizing: border-box; }
  .bars-embed h1 { margin: 0 0 6px; color: var(--ink); font: 700 clamp(22px, 5vw, 30px)/1.2 Roboto, sans-serif; text-wrap: balance; }
  .bars-embed .subtitle { margin: 0; color: var(--ink-2); font: inherit; }

  /* The scroller's height is set in the script: one screen, plus the sideways travel, plus a pause for each text card. */
  .bars-embed #pin {
    position: sticky;
    top: var(--bars-top);
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--bars-top));
    height: calc(100svh - var(--bars-top));
    overflow: hidden;
  }
  .bars-embed header { padding: 24px 16px 12px; }
  .bars-embed #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  /* Matches the note on chevalier-map.html, but sits below the chart so it never covers the bar names. */
  .bars-embed .note { margin: 0; padding: 0 16px 12px; color: #9b9ba0; font: 13px/1.45 Roboto, sans-serif; }
  .bars-embed #track { position: absolute; top: 0; left: 0; display: block; will-change: transform; }
  .bars-embed #axis { position: absolute; top: 0; left: 0; display: block; background: var(--surface); }

  .bars-embed .grid line { stroke: var(--rule); }
  .bars-embed .baseline { stroke: var(--axis); }
  .bars-embed .axis text { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bars-embed .axis path, .bars-embed .axis line { display: none; }
  .bars-embed .bar { fill: var(--wright); }
  .bars-embed .value { fill: var(--ink); font-size: 14px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .bars-embed .name { fill: var(--ink-2); font-size: 14px; text-anchor: middle; }
  .bars-embed .column { transition: opacity 200ms ease; }
  .bars-embed .column .bar { transition: fill 200ms ease; }
  .bars-embed .column.dim { opacity: 0.55; }
  .bars-embed .column.focus .bar { fill: var(--highlight); }

  /* Cards sit to the right of the chart on wide screens. CARD_SIDE_MIN in the script must match the breakpoint below. */
  .bars-embed #cards { position: absolute; top: 16px; right: 56px; z-index: 2; width: 460px; pointer-events: none; }
  .bars-embed .card {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    font-size: 15px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 250ms ease, transform 250ms ease;
    pointer-events: none;
  }
  .bars-embed .card.active { opacity: 1; transform: none; pointer-events: auto; }
  /* Card text uses the article's body font and color, at the card's own size. */
  .bars-embed .card p { margin: 0; color: #121212; font-family: var(--georgia, Georgia, serif); -webkit-font-smoothing: antialiased; }
  .bars-embed .card p + p { margin-top: 0.75em; }
  .bars-embed .card a { color: #337ab7; text-decoration: none; }
  .bars-embed .card a:hover { color: #23527c; text-decoration: underline; }
  .bars-embed .card a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 2px; }
  /* On narrow screens the script moves the cards out of the chart, into their own strip above or below it. The hed, dek,
     cards and labels shrink a little so the pinned hed, dek and note leave room for the bars. */
  @media (max-width: 919px) {
    .bars-embed header { padding: 14px 16px 8px; }
    .bars-embed h1 { font-size: clamp(19px, 3.2vw, 26px); }
    .bars-embed .subtitle { font-size: 14px; }
    .bars-embed #cards { position: relative; top: auto; right: auto; width: auto; margin: 8px 16px; }
    .bars-embed .card { padding: 12px 14px; font-size: 14px; line-height: 1.45; }
    .bars-embed .name { font-size: 12px; }
    .bars-embed .note { padding-bottom: 8px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bars-embed .column, .bars-embed .column .bar, .bars-embed .card { transition: none; }
  }
  @media (forced-colors: active) {
    .bars-embed .bar { fill: CanvasText; }
    .bars-embed .column.focus .bar { fill: Highlight; }
    .bars-embed .card { border-color: CanvasText; }
  }
</style>
</head>
<body>
<div class="bars-embed">
<div id="scroller">
  <div id="pin">
    <header>
      <h1>Wright received funding from 69 unique non-individual donors, constituting roughly a third of his total campaign funding</h1>
      <p class="subtitle" id="subtitle">These donor groups include unions, political committees, and limited liability companies.</p>
    </header>
    <div id="stage">
      <svg id="track"></svg>
      <svg id="axis" aria-hidden="true"></svg>
      <div id="cards" aria-live="polite"></div>
    </div>
    <p class="note">Note: Uncategorized non-individual donations were not included.</p>
  </div>
</div>
</div>

<script src="./scripts/bars.js"></script>
</body>
</html>
